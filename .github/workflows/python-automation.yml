name: Check Pararius

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8-20 * * *'  # Hourly from 08:00 to 20:00 UTC (09:00-21:00 Amsterdam in winter, 10:00-22:00 in summer)

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    # a hung Chrome would otherwise keep the job running for GitHub's 6 hour default
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # Ensures GitHub token is used

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python Script
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
        run: python main.py

      - name: Update SEEN apartments
        # still commit listings that were sent when a later one failed
        if: success() || failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git add seen.txt
          git commit -m "Updated seen apartments [skip ci]" || echo "No changes to commit"
          git push
